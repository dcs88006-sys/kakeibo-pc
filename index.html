<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: 'unsafe-inline'; connect-src 'none'; img-src 'self' data: blob:;" />
  <title>家計簿（PC版）</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --radius: 10px;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header.app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .app-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button, .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover, .btn:hover {
      background: var(--surface-alt);
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    button.danger:hover {
      background: var(--danger-hover);
    }

    /* PC向け2カラム：左に明細・集計、右に購入商品登録欄 */
    .workspace {
      max-width: 1380px;
      margin: 20px auto;
      padding: 0 24px 32px;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr);
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 20px;
    }

    /* 右側：購入商品登録欄をPC画面で追従・右配置 */
    .entry-column {
      order: 2;
      position: sticky;
      top: 74px;
    }

    .history-column {
      order: 1;
    }

    @media (max-width: 960px) {
      .entry-column {
        order: 1;
        position: static;
      }
      .history-column {
        order: 2;
      }
    }

    .panel-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 700;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      color: var(--text);
      background: var(--surface);
    }

    input:focus, select:focus {
      outline: 2px solid rgba(37, 99, 235, 0.25);
      border-color: var(--primary);
    }

    /* レシート読込み・プレビューエリア */
    .receipt-box {
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: var(--surface-alt);
    }

    .receipt-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .receipt-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .zoom-label {
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 44px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .receipt-viewport {
      width: 100%;
      height: 240px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .receipt-placeholder {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 16px;
    }

    .receipt-preview-img {
      transform-origin: center center;
      transition: transform 0.12s ease;
      max-width: none;
      display: block;
    }

    .form-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* 集計と明細リスト */
    .summary-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 14px;
      padding: 12px 14px;
      background: var(--surface-alt);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .summary-item {
      display: flex;
      flex-direction: column;
    }

    .summary-label {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .summary-value {
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: var(--surface-alt);
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }

    td.num, th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      background: #e0e7ff;
      color: #1e40af;
      font-weight: 600;
    }

    .thumb-btn {
      padding: 2px 6px;
      font-size: 0.78rem;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">家計簿（PC版）</h1>
    <div class="header-actions">
      <button type="button" id="exportJsonBtn">JSONバックアップ</button>
      <label class="btn" for="importJsonInput">JSON読込</label>
      <input type="file" id="importJsonInput" accept="application/json,.json" hidden />
    </div>
  </header>

  <main class="workspace">
    <!-- 左側：集計・購入履歴 -->
    <section class="panel history-column" aria-label="購入履歴と集計">
      <h2 class="panel-title">
        <span>購入履歴</span>
        <span id="itemCountLabel" style="font-size: 0.85rem; color: var(--muted); font-weight: 500;">0件</span>
      </h2>

      <div class="summary-bar">
        <div class="summary-item">
          <span class="summary-label">合計金額</span>
          <span class="summary-value" id="totalAmountLabel">¥0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">今月の合計</span>
          <span class="summary-value" id="monthAmountLabel">¥0</span>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>商品名</th>
              <th>カテゴリ</th>
              <th class="num">金額</th>
              <th>レシート</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr>
              <td colspan="6" class="empty-msg">まだ購入商品が登録されていません。右側の登録欄から追加してください。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 右側：購入商品の登録欄＆レシート読込み -->
    <aside class="panel entry-column" aria-label="購入商品の登録">
      <h2 class="panel-title">購入商品の登録</h2>

      <form id="purchaseForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="purchaseDate">購入日</label>
            <input type="date" id="purchaseDate" required />
          </div>

          <div class="form-group">
            <label for="purchaseCategory">カテゴリ</label>
            <select id="purchaseCategory">
              <option value="食費">食費</option>
              <option value="日用品">日用品</option>
              <option value="交通・移動">交通・移動</option>
              <option value="医療・健康">医療・健康</option>
              <option value="その他">その他</option>
            </select>
          </div>

          <div class="form-group">
            <label for="itemName">購入商品名</label>
            <input type="text" id="itemName" placeholder="例：牛乳・食パン" required />
          </div>

          <div class="form-group">
            <label for="itemAmount">金額（円）</label>
            <input type="number" id="itemAmount" min="0" step="1" placeholder="例：580" required />
          </div>

          <div class="form-group full">
            <label for="itemMemo">メモ（任意）</label>
            <input type="text" id="itemMemo" placeholder="店舗名や備考など" />
          </div>
        </div>

        <!-- レシート読込み・プレビュー・拡大縮小・クリア -->
        <div class="receipt-box">
          <div class="receipt-header">
            <label for="receiptInput" style="margin: 0;">レシート画像読込み</label>
            <div class="receipt-controls">
              <button type="button" id="zoomOutBtn" title="縮小">－</button>
              <span class="zoom-label" id="zoomLabel">100%</span>
              <button type="button" id="zoomInBtn" title="拡大">＋</button>
              <button type="button" id="zoomResetBtn" title="倍率リセット">リセット</button>
              <button type="button" id="clearReceiptBtn" title="レシート画像をクリア">クリア</button>
            </div>
          </div>

          <input type="file" id="receiptInput" accept="image/*" style="margin-bottom: 10px; font-size: 0.85rem;" />

          <div class="receipt-viewport" id="receiptViewport">
            <div class="receipt-placeholder" id="receiptPlaceholder">
              レシート画像を選択するとプレビューが表示されます。<br />
              （＋／－ ボタンで拡大・縮小できます）
            </div>
            <img id="receiptPreviewImg" class="receipt-preview-img" alt="レシートプレビュー" style="display: none;" />
          </div>
        </div>

        <div class="form-actions">
          <button type="reset" id="resetFormBtn">入力クリア</button>
          <button type="submit" class="primary">登録する</button>
        </div>
      </form>
    </aside>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "kakeibo_pc_records_v1";
      const MIN_SCALE = 0.5;
      const MAX_SCALE = 3.0;
      const SCALE_STEP = 0.25;

      const form = document.getElementById("purchaseForm");
      const dateInput = document.getElementById("purchaseDate");
      const categoryInput = document.getElementById("purchaseCategory");
      const nameInput = document.getElementById("itemName");
      const amountInput = document.getElementById("itemAmount");
      const memoInput = document.getElementById("itemMemo");

      const receiptInput = document.getElementById("receiptInput");
      const receiptPreviewImg = document.getElementById("receiptPreviewImg");
      const receiptPlaceholder = document.getElementById("receiptPlaceholder");
      const zoomInBtn = document.getElementById("zoomInBtn");
      const zoomOutBtn = document.getElementById("zoomOutBtn");
      const zoomResetBtn = document.getElementById("zoomResetBtn");
      const zoomLabel = document.getElementById("zoomLabel");
      const clearReceiptBtn = document.getElementById("clearReceiptBtn");

      const historyBody = document.getElementById("historyBody");
      const totalAmountLabel = document.getElementById("totalAmountLabel");
      const monthAmountLabel = document.getElementById("monthAmountLabel");
      const itemCountLabel = document.getElementById("itemCountLabel");

      const exportJsonBtn = document.getElementById("exportJsonBtn");
      const importJsonInput = document.getElementById("importJsonInput");

      let currentReceiptDataUrl = "";
      let currentScale = 1;
      let records = loadRecords();

      // 今日の日付を初期値に設定
      dateInput.value = new Date().toISOString().slice(0, 10);

      function loadRecords() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function saveRecords() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      }

      function updateScale(nextScale) {
        currentScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, Number(nextScale.toFixed(2))));
        zoomLabel.textContent = `${Math.round(currentScale * 100)}%`;
        if (currentReceiptDataUrl) {
          receiptPreviewImg.style.transform = `scale(${currentScale})`;
        }
      }

      function clearReceipt() {
        currentReceiptDataUrl = "";
        receiptInput.value = "";
        receiptPreviewImg.src = "";
        receiptPreviewImg.style.display = "none";
        receiptPlaceholder.style.display = "block";
        updateScale(1);
      }

      receiptInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) {
          clearReceipt();
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          currentReceiptDataUrl = typeof reader.result === "string" ? reader.result : "";
          if (currentReceiptDataUrl) {
            receiptPreviewImg.src = currentReceiptDataUrl;
            receiptPreviewImg.style.display = "block";
            receiptPlaceholder.style.display = "none";
            updateScale(1);
          }
        };
        reader.readAsDataURL(file);
      });

      zoomInBtn.addEventListener("click", () => updateScale(currentScale + SCALE_STEP));
      zoomOutBtn.addEventListener("click", () => updateScale(currentScale - SCALE_STEP));
      zoomResetBtn.addEventListener("click", () => updateScale(1));
      clearReceiptBtn.addEventListener("click", clearReceipt);

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        const amount = Number(amountInput.value);
        const date = dateInput.value;
        const category = categoryInput.value;
        const memo = memoInput.value.trim();

        if (!name || Number.isNaN(amount) || amount < 0 || !date) return;

        const record = {
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          date,
          category,
          name,
          amount,
          memo,
          receipt: currentReceiptDataUrl || ""
        };

        records.unshift(record);
        saveRecords();
        render();

        nameInput.value = "";
        amountInput.value = "";
        memoInput.value = "";
        clearReceipt();
        nameInput.focus();
      });

      form.addEventListener("reset", () => {
        setTimeout(() => {
          dateInput.value = new Date().toISOString().slice(0, 10);
          clearReceipt();
        }, 0);
      });

      function formatYen(num) {
        return `¥${Number(num || 0).toLocaleString("ja-JP")}`;
      }

      function render() {
        const total = records.reduce((sum, r) => sum + Number(r.amount || 0), 0);
        const nowMonth = new Date().toISOString().slice(0, 7);
        const monthTotal = records
          .filter((r) => String(r.date || "").startsWith(nowMonth))
          .reduce((sum, r) => sum + Number(r.amount || 0), 0);

        totalAmountLabel.textContent = formatYen(total);
        monthAmountLabel.textContent = formatYen(monthTotal);
        itemCountLabel.textContent = `${records.length}件`;

        historyBody.innerHTML = "";
        if (records.length === 0) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = 6;
          td.className = "empty-msg";
          td.textContent = "まだ購入商品が登録されていません。右側の登録欄から追加してください。";
          tr.appendChild(td);
          historyBody.appendChild(tr);
          return;
        }

        for (const r of records) {
          const tr = document.createElement("tr");

          const tdDate = document.createElement("td");
          tdDate.textContent = r.date || "";

          const tdName = document.createElement("td");
          tdName.textContent = r.name || "";
          if (r.memo) {
            const sub = document.createElement("div");
            sub.style.fontSize = "0.78rem";
            sub.style.color = "#64748b";
            sub.textContent = r.memo;
            tdName.appendChild(sub);
          }

          const tdCat = document.createElement("td");
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = r.category || "その他";
          tdCat.appendChild(badge);

          const tdAmount = document.createElement("td");
          tdAmount.className = "num";
          tdAmount.textContent = formatYen(r.amount);

          const tdReceipt = document.createElement("td");
          if (r.receipt) {
            const viewBtn = document.createElement("button");
            viewBtn.type = "button";
            viewBtn.className = "thumb-btn";
            viewBtn.textContent = "表示";
            viewBtn.addEventListener("click", () => {
              currentReceiptDataUrl = r.receipt;
              receiptInput.value = "";
              receiptPreviewImg.src = r.receipt;
              receiptPreviewImg.style.display = "block";
              receiptPlaceholder.style.display = "none";
              updateScale(1);
            });
            tdReceipt.appendChild(viewBtn);
          } else {
            tdReceipt.textContent = "—";
            tdReceipt.style.color = "#94a3b8";
          }

          const tdAct = document.createElement("td");
          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "danger thumb-btn";
          delBtn.textContent = "削除";
          delBtn.addEventListener("click", () => {
            records = records.filter((item) => item.id !== r.id);
            saveRecords();
            render();
          });
          tdAct.appendChild(delBtn);

          tr.append(tdDate, tdName, tdCat, tdAmount, tdReceipt, tdAct);
          historyBody.appendChild(tr);
        }
      }

      // JSONバックアップ書き出し
      exportJsonBtn.addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `kakeibo-pc-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // JSON読み込み
      importJsonInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(String(reader.result || "[]"));
            if (!Array.isArray(imported)) {
              alert("JSONの形式が正しくありません。配列データを選択してください。");
              return;
            }
            records = imported;
            saveRecords();
            render();
          } catch {
            alert("JSONファイルの読み込みに失敗しました。");
          } finally {
            importJsonInput.value = "";
          }
        };
        reader.readAsText(file);
      });

      render();
    })();
  </script>
</body>
</html>
